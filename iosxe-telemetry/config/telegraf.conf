# IOS-XE MDT collector (Telegraf cisco_telemetry_mdt → InfluxDB 2.x).
# Mounted at /etc/telegraf/telegraf.conf — secrets from container --env-file.

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "clawlab-telegraf"
  omit_hostname = false

[[inputs.cisco_telemetry_mdt]]
  transport = "grpc"
  service_address = ":57000"
  max_msg_size = 4000000
  # Lab: mount TLS cert/key and uncomment for gRPC-TLS from switches.
  # tls_cert = "/etc/telegraf/tls.crt"
  # tls_key  = "/etc/telegraf/tls.key"

[[outputs.influxdb_v2]]
  urls = ["http://iosxe-influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
