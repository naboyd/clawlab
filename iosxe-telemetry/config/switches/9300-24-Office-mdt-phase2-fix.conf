! Fix invalid phase-2 XPaths on 9300-24-Office (subs 606–608)
! Re-applies subscriptions with paths from Cisco-IOS-XE YANG models.
!
! Was wrong                          → Correct
! /poe-ios-xe-oper:poe-port-detail   → /poe-ios-xe-oper:poe-oper-data/poe-port-detail
! /lldp-ios-xe-oper:lldp-nbrs/...    → /lldp-ios-xe-oper:lldp-entries/lldp-entry
! /spanning-tree-ios-xe-oper:...     → /stp-ios-xe-oper:stp-details/stp-detail

configure terminal
!
no telemetry ietf subscription 606
no telemetry ietf subscription 607
no telemetry ietf subscription 608
!
telemetry ietf subscription 606
 encoding encode-kvgpb
 filter xpath /poe-ios-xe-oper:poe-oper-data/poe-port-detail
 stream yang-push
 update-policy periodic 30000
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 607
 encoding encode-kvgpb
 filter xpath /lldp-ios-xe-oper:lldp-entries/lldp-entry
 stream yang-push
 update-policy periodic 60000
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 608
 encoding encode-kvgpb
 filter xpath /stp-ios-xe-oper:stp-details/stp-detail
 stream yang-push
 update-policy periodic 30000
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
end
write memory
