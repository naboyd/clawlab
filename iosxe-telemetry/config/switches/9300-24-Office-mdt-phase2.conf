! ClawLab MDT phase 2 — 9300-24-Office → icecream Telegraf
! Collector: 192.168.128.93:57000  protocol grpc-tcp
!
! Adds platform, environment, PoE, LLDP, STP (604–608).
! Tunes interface subscription 603 from 5s → 30s (lower Influx volume).
! Requires phase 1 subs 601–603 (or apply standalone after creating them).
!
! Rollback: 9300-24-Office-mdt-phase2-rollback.conf

configure terminal
!
! Re-tune 603 — interface stats every 30s (was 5s in phase 1)
telemetry ietf subscription 603
 update-policy periodic 30000
!
telemetry ietf subscription 604
 encoding encode-kvgpb
 filter xpath /platform-ios-xe-oper:components/component
 stream yang-push
 update-policy periodic 30000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 605
 encoding encode-kvgpb
 filter xpath /environment-ios-xe-oper:environment-sensors/environment-sensor
 stream yang-push
 update-policy periodic 30000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 606
 encoding encode-kvgpb
 filter xpath /poe-ios-xe-oper:poe-port-detail
 stream yang-push
 update-policy periodic 30000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 607
 encoding encode-kvgpb
 filter xpath /lldp-ios-xe-oper:lldp-nbrs/lldp-nbr
 stream yang-push
 update-policy periodic 60000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 608
 encoding encode-kvgpb
 filter xpath /spanning-tree-ios-xe-oper:spanning-tree-oper-data
 stream yang-push
 update-policy periodic 30000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
end
write memory
