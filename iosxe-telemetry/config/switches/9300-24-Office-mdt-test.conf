! ClawLab MDT test — 9300-24-Office → icecream Telegraf
! Collector: 192.168.128.93:57000  protocol grpc-tcp  (lab / no TLS on Telegraf)
!
! Copy/paste from configure terminal. Regenerate with:
!   bash iosxe-telemetry/scripts/gen-mdt-test-config.sh --host 9300-24-Office
!
! Prerequisites:
!   - IOS-XE 16.10+ (gRPC dial-out MDT)
!   - NTP synced: show clock
!   - Route from switch to 192.168.128.93:57000
!   - If source must leave via VRF, uncomment source-vrf / source-address lines
!
! Verify:
!   show telemetry ietf subscription all
!   show telemetry ietf subscription 601
!
! Rollback: iosxe-telemetry/config/switches/9300-24-Office-mdt-test-rollback.conf

configure terminal
!
telemetry ietf subscription 601
 encoding encode-kvgpb
 filter xpath /process-cpu-ios-xe-oper:cpu-usage/cpu-utilization/five-seconds
 stream yang-push
 update-policy periodic 5000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 602
 encoding encode-kvgpb
 filter xpath /memory-ios-xe-oper:memory-statistics/memory-statistic
 stream yang-push
 update-policy periodic 5000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
telemetry ietf subscription 603
 encoding encode-kvgpb
 filter xpath /interfaces-ios-xe-oper:interfaces/interface
 stream yang-push
 update-policy periodic 5000
 ! source-vrf Mgmt-vrf
 ! source-address 10.x.x.x
 receiver ip address 192.168.128.93 57000 protocol grpc-tcp
!
end
write memory
