# IOS-XE configuration policy — single source of truth for:
#   • DefenseClaw inspect (always_block → CRITICAL hard-block)
#   • ssh-ops MCP propose_change / ios_config_lines (allow_groups + always_block)
#
# Command taxonomy aligned with Cisco IOS-XE 17.17 Catalyst 9200 Command Reference
# (see docs/ios-xe-command-reference-index.yaml).
#
# Severity model (DefenseClaw):
#   CRITICAL — always_block entries: never reach the device (hard-block chat/tools)
#   HIGH     — optional advisory rules (alert, not block) for risky-but-permitted ops
#   MCP      — per-group access: deny | approve | allow (see allow_groups.access)
#
# Webex: add event type "change" to webhook events to get alerts when approved
# config is applied (see change_notify.py).
version: 1
platform: ios-xe
mode: default_deny
approval_policy:
  require_proposer_identity: true
  forbid_self_approval: true
  forbidden_proposers:
  - agent
  - mcp
  - system
  - unknown
  - gui-operator
  default:
    forbid_self_approval: true
always_block:
- id: IOS-BLK-USERNAME
  group: identity
  pattern: (?i)^username\s+\S+
  title: Cisco local username create/update
  severity: CRITICAL
- id: IOS-BLK-NO-USERNAME
  group: identity
  pattern: (?i)^no\s+username\s+\S+
  title: Cisco local username delete
  severity: CRITICAL
- id: IOS-BLK-ENABLE-SECRET
  group: management
  pattern: (?i)^enable\s+secret\b
  title: Enable secret change
  severity: CRITICAL
- id: IOS-BLK-LINE
  group: management
  pattern: (?i)^line\s+
  title: Line (console/VTY/AUX) configuration
  severity: CRITICAL
- id: IOS-BLK-IP-SSH
  group: management
  pattern: (?i)^ip\s+ssh\b
  title: SSH server configuration
  severity: CRITICAL
- id: IOS-BLK-CRYPTO
  group: management
  pattern: (?i)^crypto\s+
  title: Crypto / PKI / IPsec configuration
  severity: CRITICAL
- id: IOS-BLK-CONTROL-PLANE
  group: management
  pattern: (?i)^control-plane\b
  title: Control-plane service policy
  severity: CRITICAL
- id: IOS-BLK-RELOAD
  group: destructive
  pattern: (?i)^reload\b
  title: Device reload
  severity: CRITICAL
- id: IOS-BLK-WRITE-ERASE
  group: destructive
  pattern: (?i)^write\s+erase\b
  title: Erase startup config
  severity: CRITICAL
- id: IOS-BLK-ERASE
  group: destructive
  pattern: (?i)^erase\s+
  title: Erase flash/filesystem
  severity: CRITICAL
- id: IOS-BLK-FORMAT
  group: destructive
  pattern: (?i)^format\s+
  title: Format filesystem
  severity: CRITICAL
- id: IOS-BLK-COPY
  group: destructive
  pattern: (?i)^copy\s+
  title: Copy files or configs (exfil/injection risk)
  severity: CRITICAL
- id: IOS-BLK-BOOT
  group: destructive
  pattern: (?i)^boot\s+
  title: Boot system / image path
  severity: CRITICAL
- id: IOS-BLK-ARCHIVE
  group: destructive
  pattern: (?i)^archive\b
  title: Configuration archive
  severity: CRITICAL
- id: IOS-BLK-FACTORY-RESET
  group: destructive
  pattern: (?i)^factory-reset\b
  title: Factory reset
  severity: CRITICAL
- id: IOS-BLK-INSTALL
  group: destructive
  pattern: (?i)^install\s+
  title: Software install / SMU
  severity: CRITICAL
- id: IOS-BLK-LICENSE
  group: destructive
  pattern: (?i)^license\s+
  title: License manipulation
  severity: CRITICAL
- id: IOS-BLK-SDM
  group: destructive
  pattern: (?i)^sdm\s+prefer\b
  title: SDM template change (reload required)
  severity: CRITICAL
- id: IOS-BLK-KRON
  group: destructive
  pattern: (?i)^kron\b
  title: Scheduled EXEC (kron)
  severity: CRITICAL
- id: IOS-BLK-EEM
  group: destructive
  pattern: (?i)^event\s+manager\b
  title: Embedded Event Manager applet
  severity: CRITICAL
- id: IOS-BLK-SNMP-COMMUNITY
  group: snmp
  pattern: (?i)^snmp-server\s+community\b
  title: SNMP community string
  severity: CRITICAL
- id: IOS-BLK-SNMP-GROUP
  group: snmp
  pattern: (?i)^snmp-server\s+group\b
  title: SNMP V3 group
  severity: CRITICAL
- id: IOS-BLK-SNMP-USER
  group: snmp
  pattern: (?i)^snmp-server\s+user\b
  title: SNMP V3 user
  severity: CRITICAL
- id: IOS-BLK-HTTP-SERVER
  group: management
  pattern: (?i)^ip\s+http\s+server\b
  title: HTTP server enable
  severity: CRITICAL
group_categories:
- id: vlan
  label: VLAN (Part XIII, ch. 15)
- id: interface
  label: Interface & Hardware (Part III, ch. 4)
- id: spanning_tree
  label: Spanning Tree (Part VI, ch. 7)
- id: ip_addressing
  label: IP Addressing (Part IV, ch. 5)
- id: routing
  label: Routing (Part IX, ch. 10)
- id: security
  label: Security & AAA (Part X, ch. 11)
- id: qos
  label: QoS (Part VIII, ch. 9)
- id: netmgmt
  label: Network Management (Part VII, ch. 8)
- id: system
  label: System Management (Part XII, ch. 13)
- id: multicast
  label: Multicast (Part V, ch. 6)
- id: fabric
  label: SD-Access / TrustSec / Stacking
allow_groups:
  vlan:
    category: vlan
    description: Create VLAN and assign name
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^vlan\s+\d+
    - (?i)^\s*name\s+
  vlan_svi:
    category: vlan
    description: L3 SVI only (interface VlanN + ip address)
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+Vlan\d+
    - (?i)^\s*ip\s+address\s+(?:\d{1,3}\.){3}\d{1,3}(?:\s+(?:\d{1,3}\.){3}\d{1,3}|/\d{1,2}|\s+\d{1,2})?(?:\s+secondary)?\s*$
    - (?i)^\s*no\s+shutdown\s*$
    - (?i)^\s*description\s+
    - (?i)^\s*shutdown\s*$
  vlan_l3:
    category: vlan
    description: Create VLAN plus SVI (L3 switch / gateway)
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^vlan\s+\d+
    - (?i)^\s*name\s+
    - (?i)^interface\s+Vlan\d+
    - (?i)^\s*ip\s+address\s+(?:\d{1,3}\.){3}\d{1,3}(?:\s+(?:\d{1,3}\.){3}\d{1,3}|/\d{1,2}|\s+\d{1,2})?(?:\s+secondary)?\s*$
    - (?i)^\s*no\s+shutdown\s*$
    - (?i)^\s*description\s+
  private_vlan:
    category: vlan
    description: Private VLAN mapping (isolated/community)
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^vlan\s+\d+
    - (?i)^\s*private-vlan\b
    - (?i)^\s*name\s+
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*switchport\s+mode\s+private-vlan\b
    - (?i)^\s*switchport\s+private-vlan\b
  vtp:
    category: vlan
    description: VTP domain/mode/version
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^vtp\s+
    - (?i)^\s*vtp\s+
  interface_l2:
    category: interface
    description: Access port admin state, VLAN, portfast edge
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa|Ethernet|Et)\S+
    - (?i)^\s*shutdown\s*$
    - (?i)^\s*no\s+shutdown\s*$
    - (?i)^\s*description\s+
    - (?i)^\s*switchport\s+mode\s+access\s*$
    - (?i)^\s*switchport\s+access\s+vlan\s+\d+
    - (?i)^\s*switchport\s+nonegotiate\s*$
    - (?i)^\s*spanning-tree\s+portfast\s+edge\s*$
    - (?i)^\s*spanning-tree\s+bpduguard\s+enable\s*$
    - (?i)^\s*speed\s+\S+
    - (?i)^\s*duplex\s+\S+
  interface_trunk:
    category: interface
    description: Trunk mode, allowed VLANs, native VLAN
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa|Ethernet|Et)\S+
    - (?i)^\s*switchport\s+mode\s+trunk\s*$
    - (?i)^\s*switchport\s+trunk\s+
    - (?i)^\s*switchport\s+nonegotiate\s*$
    - (?i)^\s*description\s+
    - (?i)^\s*shutdown\s*$
    - (?i)^\s*no\s+shutdown\s*$
  voice_vlan:
    category: interface
    description: Access port voice VLAN (Cisco phone)
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*switchport\s+mode\s+access\s*$
    - (?i)^\s*switchport\s+access\s+vlan\s+\d+
    - (?i)^\s*switchport\s+voice\s+vlan\s+
    - (?i)^\s*mls\s+qos\s+trust\s+
    - (?i)^\s*description\s+
  interface_po:
    category: interface
    description: EtherChannel / port-channel (LACP/PAgP)
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa|Port-channel|Po)\S+
    - (?i)^\s*channel-group\s+\d+
    - (?i)^\s*channel-protocol\s+
    - (?i)^\s*description\s+
    - (?i)^\s*shutdown\s*$
    - (?i)^\s*no\s+shutdown\s*$
    - (?i)^\s*switchport\s+
    - (?i)^lacp\s+
    - (?i)^port-channel\s+
  storm_control:
    category: interface
    description: Storm-control thresholds
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*storm-control\s+
  lldp_cdp:
    category: interface
    description: LLDP/CDP on interface or globally
    access: approve
    risk: low
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*lldp\s+
    - (?i)^\s*cdp\s+
    - (?i)^lldp\s+run\s*$
    - (?i)^cdp\s+run\s*$
    - (?i)^no\s+cdp\s+run\s*$
  udld:
    category: interface
    description: UDLD on fiber uplinks
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te)\S+
    - (?i)^\s*udld\s+
    - (?i)^udld\s+
  macro_port:
    category: interface
    description: SmartPort / interface macro apply
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*macro\s+
    - (?i)^macro\s+
  loopback:
    category: interface
    description: Loopback interface with IPv4 address
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+Loopback\d+
    - (?i)^\s*ip\s+address\s+
    - (?i)^\s*description\s+
    - (?i)^\s*shutdown\s*$
    - (?i)^\s*no\s+shutdown\s*$
  spanning_tree_if:
    category: spanning_tree
    description: Per-interface STP cost, priority, portfast, guard
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa|Port-channel|Po)\S+
    - (?i)^\s*spanning-tree\s+
  spanning_tree_global:
    category: spanning_tree
    description: Global STP mode (rapid-pvst/mst), root bridge
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^spanning-tree\s+
    - (?i)^spanning-tree\s+mst\s+configuration
    - (?i)^\s*instance\s+\d+
    - (?i)^\s*name\s+
    - (?i)^\s*revision\s+\d+
  ipv6_svi:
    category: ip_addressing
    description: IPv6 address on SVI or routed interface
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:Vlan\d+|Loopback\d+|GigabitEthernet|Gi|TenGigabitEthernet|Te)\S*
    - (?i)^\s*ipv6\s+address\s+
    - (?i)^\s*ipv6\s+enable\s*$
    - (?i)^\s*no\s+shutdown\s*$
  ip_helpers:
    category: ip_addressing
    description: IP helper-address (DHCP relay)
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:Vlan\d+|GigabitEthernet|Gi|TenGigabitEthernet|Te)\S*
    - (?i)^\s*ip\s+helper-address\s+
  dhcp_snooping:
    category: ip_addressing
    description: DHCP snooping global and per-VLAN
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+dhcp\s+snooping\b
    - (?i)^ip\s+dhcp\s+snooping\s+vlan\s+
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*ip\s+dhcp\s+snooping\s+
  dhcp_pool:
    category: ip_addressing
    description: On-box DHCP address pool
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+dhcp\s+pool\s+
    - (?i)^\s*network\s+
    - (?i)^\s*default-router\s+
    - (?i)^\s*dns-server\s+
    - (?i)^\s*domain-name\s+
    - (?i)^\s*lease\s+
  hsrp_vrrp:
    category: ip_addressing
    description: HSRP / VRRP first-hop redundancy
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+Vlan\d+
    - (?i)^\s*standby\s+
    - (?i)^\s*vrrp\s+
    - (?i)^\s*ip\s+address\s+
  routing_static: &id001
    category: routing
    description: Static routes (non-default)
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+route\s+(?!0\.0\.0\.0\b)\S+
    - (?i)^ip\s+route\s+vrf\s+\S+\s+(?!0\.0\.0\.0\b)\S+
    - (?i)^ipv6\s+route\s+(?!::/0\b)\S+
  routing_default:
    category: routing
    description: Default route injection (0.0.0.0/0 or ::/0)
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+route\s+0\.0\.0\.0\b
    - (?i)^ipv6\s+route\s+::/0\b
  routing_ospf:
    category: routing
    description: OSPF routing process and area/network
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+ospf\b
    - (?i)^\s*network\s+
    - (?i)^\s*area\s+
    - (?i)^\s*passive-interface\s+
    - (?i)^\s*default-information\s+
  routing_ospfv3:
    category: routing
    description: OSPFv3 routing process
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+ospfv3\b
    - (?i)^\s*address-family\s+
  routing_bgp:
    category: routing
    description: BGP routing process and neighbors
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+bgp\b
    - (?i)^\s*neighbor\s+
    - (?i)^\s*network\s+
    - (?i)^\s*address-family\s+
    - (?i)^\s*bgp\s+
  routing_eigrp:
    category: routing
    description: EIGRP routing process
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+eigrp\b
    - (?i)^\s*network\s+
    - (?i)^\s*passive-interface\s+
    - (?i)^\s*af-interface\s+
  routing_rip:
    category: routing
    description: RIP routing process
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+rip\b
    - (?i)^\s*network\s+
    - (?i)^\s*version\s+
  routing_isis:
    category: routing
    description: IS-IS routing process
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^router\s+isis\b
    - (?i)^\s*net\s+
    - (?i)^\s*metric-style\s+
  routing_route_map:
    category: routing
    description: Route-map policy definitions
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^route-map\s+
    - (?i)^\s*(?:match|set)\s+
  routing_prefix_list:
    category: routing
    description: IP/IPv6 prefix-list filters
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+prefix-list\b
    - (?i)^ipv6\s+prefix-list\b
    - (?i)^\s*(?:permit|deny|seq)\s+
  routing_redistribute:
    category: routing
    description: Route redistribution under routing process
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^redistribute\b
  aaa_core:
    category: security
    description: AAA new-model, authentication, authorization, accounting
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^aaa\s+new-model\s*$
    - (?i)^aaa\s+authentication\s+
    - (?i)^aaa\s+authorization\s+
    - (?i)^aaa\s+accounting\s+
    - (?i)^aaa\s+session-id\s+
    - (?i)^aaa\s+server\s+
    - (?i)^aaa\s+group\s+
  aaa_radius:
    category: security
    description: RADIUS server and global RADIUS settings
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^radius\s+
    - (?i)^radius-server\s+
    - (?i)^aaa\s+group\s+server\s+radius\s+
  aaa_tacacs:
    category: security
    description: TACACS+ server and global TACACS settings
    access: deny
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^tacacs\s+
    - (?i)^tacacs-server\s+
    - (?i)^aaa\s+group\s+server\s+tacacs\+?\s+
  acl_standard:
    category: security
    description: Standard numbered/named IPv4 ACL entries
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+access-list\s+standard\s+
    - (?i)^access-list\s+\d+\s+
    - (?i)^\s*(?:permit|deny)\s+
    - (?i)^\s*remark\s+
  acl_extended:
    category: security
    description: Extended numbered/named IPv4 ACL entries
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ip\s+access-list\s+extended\s+
    - (?i)^access-list\s+\d{3,}\s+
    - (?i)^\s*(?:permit|deny)\s+
    - (?i)^\s*remark\s+
  acl_ipv6:
    category: security
    description: IPv6 access-list entries
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^ipv6\s+access-list\s+
    - (?i)^\s*(?:permit|deny|sequence)\s+
    - (?i)^\s*remark\s+
  acl_mac:
    category: security
    description: Layer-2 MAC access-list
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^mac\s+access-list\s+
    - (?i)^\s*(?:permit|deny)\s+
  acl_apply:
    category: security
    description: Apply ACL to interface (ip/ipv6 access-group)
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|Vlan|Port-channel|Po)\S*
    - (?i)^\s*ip\s+access-group\s+
    - (?i)^\s*ipv6\s+traffic-filter\s+
  dot1x_port:
    category: security
    description: 802.1X / access-session on access port
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*authentication\s+
    - (?i)^\s*dot1x\s+
    - (?i)^\s*access-session\s+
  qos_class_map:
    category: qos
    description: Class-map match criteria
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^class-map\s+
    - (?i)^\s*match\s+
  qos_policy_map:
    category: qos
    description: Policy-map classes and actions
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^policy-map\s+
    - (?i)^\s*class\s+
    - (?i)^\s*priority\b
    - (?i)^\s*police\s+
    - (?i)^\s*shape\s+
    - (?i)^\s*bandwidth\s+
    - (?i)^\s*set\s+
  qos_service_policy:
    category: qos
    description: Apply service-policy on interface or control-plane
    access: approve
    risk: high
    defenseclaw_alert: true
    patterns:
    - (?i)^interface\s+(?:GigabitEthernet|Gi|TenGigabitEthernet|Te|FastEthernet|Fa)\S+
    - (?i)^\s*service-policy\s+
    - (?i)^control-plane\b
    - (?i)^\s*service-policy\s+
  qos_auto_mls:
    category: qos
    description: Auto QoS and MLS QoS trust settings
    access: approve
    risk: medium
    defenseclaw_alert: true
    patterns:
    - (?i)^auto\s+qos\s+
