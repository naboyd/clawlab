map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 192.168.1.10:8445 ssl;
    server_name lab.example.com lab-host 192.168.1.10;

    ssl_certificate     /home/clawlab/mcp/acme/lego/certificates/lab.example.com.crt;
    ssl_certificate_key /home/clawlab/mcp/acme/lego/certificates/lab.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_pam              "DefenseClaw policy editor (Linux login)";
    auth_pam_service_name "openclaw-admin";

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
