server {
    listen 192.168.128.93:8444 ssl;
    server_name icecream.naboydciscolab.com icecream 192.168.128.93;

    ssl_certificate     /home/naboyd/mcp/acme/lego/certificates/icecream.naboydciscolab.com.crt;
    ssl_certificate_key /home/naboyd/mcp/acme/lego/certificates/icecream.naboydciscolab.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_pam              "OpenClaw Control (Linux login)";
    auth_pam_service_name "openclaw-admin";

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
