map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 192.168.128.93:8443 ssl;
    server_name icecream.naboydciscolab.com icecream 192.168.128.93;

    ssl_certificate     /home/naboyd/mcp/acme/lego/certificates/icecream.naboydciscolab.com.crt;
    ssl_certificate_key /home/naboyd/mcp/acme/lego/certificates/icecream.naboydciscolab.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_pam              "ssh-ops admin (Linux login)";
    auth_pam_service_name "openclaw-admin";

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
