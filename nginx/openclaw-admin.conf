# /etc/nginx/sites-available/openclaw-admin.conf
# LAN-facing HTTPS reverse proxy for the OpenClaw Control UI.
# Authenticates against the Linux user DB via PAM, forwards the username as
# x-forwarded-user. Requires: apt install libnginx-mod-http-auth-pam

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 192.168.128.93:8443 ssl;
    server_name icecream 192.168.128.93;

    ssl_certificate     /etc/nginx/ssl/openclaw-admin.crt;
    ssl_certificate_key /etc/nginx/ssl/openclaw-admin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    auth_pam              "OpenClaw Admin (Linux login)";
    auth_pam_service_name "openclaw-admin";

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:18789;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header X-Forwarded-User  $remote_user;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header Host              $host;

        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
