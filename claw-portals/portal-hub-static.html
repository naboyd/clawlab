<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clawlab</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:#0f1117;color:#e8eaed;height:100vh;display:flex;flex-direction:column}
    header{padding:.65rem 1rem;background:#1a1d27;border-bottom:1px solid #2a2f3d}
    header h1{font-size:1.05rem;margin:0;font-weight:600}
    .tabs{display:flex;gap:.35rem;padding:.5rem 1rem;background:#141720;border-bottom:1px solid #2a2f3d}
    .tab{padding:.45rem .95rem;border:1px solid #2a2f3d;border-radius:8px;background:#1f2430;
         color:#c9cdd3;cursor:pointer;font-size:.88rem}
    .tab.active{background:#2c5cff;border-color:#2c5cff;color:#fff}
    .frame-wrap{flex:1;min-height:0;background:#fafafa}
    iframe{width:100%;height:100%;border:0;display:none;background:#fff}
    iframe.active{display:block}
  </style>
</head>
<body>
<header><h1>clawlab</h1></header>
<nav class="tabs">
  <button type="button" class="tab active" data-target="frame-openclaw" onclick="showTab('openclaw')">OpenClaw</button>
  <button type="button" class="tab" data-target="frame-ssh-ops" onclick="showTab('ssh-ops')">MCP Admin</button>
  <button type="button" class="tab" data-target="frame-defenseclaw" onclick="showTab('defenseclaw')">DefenseClaw Policies</button>
</nav>
<div class="frame-wrap">
  <iframe id="frame-openclaw" class="active" src="/openclaw/" title="OpenClaw"></iframe>
  <iframe id="frame-ssh-ops" src="/ssh-ops/" title="MCP Admin"></iframe>
  <iframe id="frame-defenseclaw" src="/defenseclaw/" title="DefenseClaw Policies"></iframe>
</div>
<script>
function showTab(id){
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('iframe').forEach(function(f){ f.classList.remove('active'); });
  document.querySelector('[data-target="frame-'+id+'"]').classList.add('active');
  document.getElementById('frame-'+id).classList.add('active');
}
</script>
</body>
</html>
