<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>clawlab</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/clawlab-assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/clawlab-assets/apple-touch-icon.png">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:#0f1117;color:#e8eaed;height:100vh;display:flex;flex-direction:column}
    header{padding:.65rem 1rem;background:#1a1d27;border-bottom:1px solid #2a2f3d}
    header h1{font-size:1.05rem;margin:0;font-weight:600}
    .tabs{display:flex;gap:.35rem;padding:.5rem 1rem;background:#141720;border-bottom:1px solid #2a2f3d}
    .tab{padding:.45rem .95rem;border:1px solid #2a2f3d;border-radius:8px;background:#1f2430;
         color:#c9cdd3;cursor:pointer;font-size:.88rem}
    .tab.active{background:#2c5cff;border-color:#2c5cff;color:#fff}
    .frame-wrap{flex:1;min-height:0;background:#fafafa;display:flex;flex-direction:column}
    iframe{width:100%;height:100%;border:0;display:none;background:#fff;flex:1}
    iframe.active{display:block}
    .hub-panel{display:none;flex:1;align-items:center;justify-content:center;background:#141720;padding:1.5rem}
    .hub-panel.active{display:flex}
    .external-card{max-width:440px;padding:1.5rem 1.75rem;background:#1f2430;border:1px solid #2a2f3d;
                    border-radius:12px;text-align:center}
    .external-card h2{margin:0 0 .6rem;font-size:1.1rem}
    .hint{color:#9aa0a6;font-size:.88rem;line-height:1.45}
    .open-btn{display:inline-block;margin-top:1rem;padding:.65rem 1.25rem;background:#2c5cff;color:#fff;
              border-radius:8px;text-decoration:none;font-size:.9rem}
  </style>
</head>
<body>
<header><h1 style="display:flex;align-items:center;gap:.5rem">
  <img src="/clawlab-assets/favicon-32.png" alt="" width="28" height="28" style="border-radius:7px">
  clawlab</h1></header>
<nav class="tabs">
  <button type="button" class="tab active" data-tab="openclaw" onclick="showTab('openclaw')">OpenClaw</button>
  <button type="button" class="tab" data-tab="ssh-ops" onclick="showTab('ssh-ops')">MCP Admin</button>
  <button type="button" class="tab" data-tab="telemetry" onclick="showTab('telemetry')">Telemetry</button>
  <button type="button" class="tab" data-tab="defenseclaw" onclick="showTab('defenseclaw')">DefenseClaw Policies</button>
</nav>
<div class="frame-wrap">
  <div id="panel-openclaw" class="hub-panel active">
    <div class="external-card">
      <h2>OpenClaw</h2>
      <p class="hint">OpenClaw blocks iframe embedding. Open it in a new window.</p>
      <a class="open-btn" href="/openclaw/" target="_blank" rel="noopener noreferrer">Open OpenClaw ↗</a>
    </div>
  </div>
  <iframe id="frame-ssh-ops" data-src="/ssh-ops/" title="MCP Admin"></iframe>
  <iframe id="frame-telemetry" data-src="/grafana/" title="Telemetry"></iframe>
  <iframe id="frame-defenseclaw" data-src="/defenseclaw/" title="DefenseClaw Policies"></iframe>
</div>
<script>
function showTab(id){
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('active', b.dataset.tab === id);
  });
  document.querySelectorAll('.hub-panel').forEach(function(p){
    p.classList.toggle('active', p.id === 'panel-' + id);
  });
  document.querySelectorAll('iframe').forEach(function(f){
    var on = f.id === 'frame-' + id;
    f.classList.toggle('active', on);
    if (on && f.dataset.src && !f.getAttribute('src')) {
      f.src = f.dataset.src;
    }
  });
}
</script>
</body>
</html>
